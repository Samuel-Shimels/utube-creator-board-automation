<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Content Manager</title>
    
    <!-- External Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

    <style>
        /* Custom CSS Variables */
        :root {
            --primary: #3b82f6;
            --primary-dark: #2563eb;
            --secondary: #64748b;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --info: #06b6d4;
            --light: #f8fafc;
            --dark: #1e293b;
            --border: #e2e8f0;
            --shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        /* Loading Screen */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        .loading-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Kanban Board Styles */
        .kanban-board {
            display: flex;
            gap: 1rem;
            overflow-x: auto;
            padding: 1rem 0;
            min-height: 500px;
        }

        .phase-column {
            flex: 0 0 300px;
            background: white;
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            min-height: 500px;
        }

        .phase-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 0.75rem;
            border-bottom: 2px solid var(--border);
        }

        .phase-title {
            font-weight: 600;
            font-size: 1.1rem;
            color: var(--dark);
        }

        .phase-count {
            background: var(--primary);
            color: white;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.875rem;
            font-weight: 500;
        }

        .task-card {
            background: white;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 0.75rem;
            cursor: grab;
            box-shadow: var(--shadow);
            transition: all 0.2s ease;
            position: relative;
        }

        .task-card:hover {
            box-shadow: var(--shadow-lg);
            transform: translateY(-2px);
        }

        .task-card:active {
            cursor: grabbing;
        }

        .task-card.overdue {
            border-left: 4px solid var(--danger);
        }

        .task-card.due-soon {
            border-left: 4px solid var(--warning);
        }

        .task-title {
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 0.5rem;
            line-height: 1.4;
        }

        .task-pillar {
            display: inline-block;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }

        .task-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.875rem;
            color: var(--secondary);
            margin-top: 0.75rem;
        }

        .task-assignee {
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        .task-due-date {
            font-size: 0.75rem;
        }

        .task-due-date.overdue {
            color: var(--danger);
            font-weight: 600;
        }

        .task-due-date.due-soon {
            color: var(--warning);
            font-weight: 600;
        }

        /* Dashboard Cards */
        .metric-card {
            background: white;
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            transition: all 0.2s ease;
        }

        .metric-card:hover {
            box-shadow: var(--shadow-lg);
            transform: translateY(-2px);
        }

        .metric-value {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--primary);
            line-height: 1;
        }

        .metric-label {
            color: var(--secondary);
            font-size: 0.875rem;
            font-weight: 500;
            margin-top: 0.5rem;
        }

        .metric-change {
            font-size: 0.75rem;
            font-weight: 500;
            margin-top: 0.25rem;
        }

        .metric-change.positive {
            color: var(--success);
        }

        .metric-change.negative {
            color: var(--danger);
        }

        /* Pillar Colors */
        .pillar-educational { background: #dbeafe; color: #1e40af; }
        .pillar-product { background: #e0e7ff; color: #3730a3; }
        .pillar-success { background: #d1fae5; color: #065f46; }
        .pillar-support { background: #fef3c7; color: #92400e; }
        .pillar-marketing { background: #fee2e2; color: #991b1b; }

        /* Responsive Design */
        @media (max-width: 768px) {
            .kanban-board {
                flex-direction: column;
            }
            
            .phase-column {
                flex: 1;
                min-width: 100%;
            }
            
            .metric-card {
                margin-bottom: 1rem;
            }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* Animation Classes */
        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .slide-in {
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from { transform: translateX(-20px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Loading Screen -->
    <div id="loadingScreen" class="loading-screen">
        <div class="text-white text-center">
            <h1 class="text-4xl font-bold mb-4">YouTube Content Manager</h1>
            <div class="loading-spinner mb-4"></div>
            <p class="text-lg">Loading your content dashboard...</p>
        </div>
    </div>

    <!-- Main Content -->
    <div id="mainContent" class="container-fluid" style="display: none;">
        <!-- Header -->
        <header class="bg-white shadow-sm border-b border-gray-200 mb-6">
            <div class="container-fluid px-4 py-4">
                <div class="flex items-center justify-between">
                    <div class="flex items-center space-x-4">
                        <h1 class="text-2xl font-bold text-gray-900">
                            <i class="bi bi-youtube text-red-500 mr-2"></i>
                            YouTube Content Manager
                        </h1>
                    </div>
                    <div class="flex items-center space-x-4">
                        <button id="refreshBtn" class="btn btn-outline-primary btn-sm">
                            <i class="bi bi-arrow-clockwise mr-1"></i>
                            Refresh
                        </button>
                        <button id="addContentBtn" class="btn btn-primary btn-sm">
                            <i class="bi bi-plus-circle mr-1"></i>
                            Add Content
                        </button>
                        <div class="dropdown">
                            <button class="btn btn-outline-secondary btn-sm dropdown-toggle" type="button" data-bs-toggle="dropdown">
                                <i class="bi bi-gear mr-1"></i>
                                Settings
                            </button>
                            <ul class="dropdown-menu">
                                <li><a class="dropdown-item" href="#" onclick="exportData()">
                                    <i class="bi bi-download mr-2"></i>Export Data
                                </a></li>
                                <li><a class="dropdown-item" href="#" onclick="clearCache()">
                                    <i class="bi bi-trash mr-2"></i>Clear Cache
                                </a></li>
                                <li><hr class="dropdown-divider"></li>
                                <li><a class="dropdown-item" href="#" onclick="initSheets()">
                                    <i class="bi bi-database mr-2"></i>Initialize Sheets
                                </a></li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <!-- Dashboard Section -->
        <section class="mb-8">
            <div class="container-fluid px-4">
                <h2 class="text-xl font-semibold text-gray-900 mb-4">
                    <i class="bi bi-graph-up mr-2"></i>
                    Dashboard Overview
                </h2>
                <div id="dashboardCards" class="row g-4">
                    <!-- Dashboard cards will be populated here -->
                </div>
            </div>
        </section>

        <!-- Filters Section -->
        <section class="mb-6">
            <div class="container-fluid px-4">
                <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-4">
                    <div class="row g-3">
                        <div class="col-md-3">
                            <label class="form-label">Filter by Pillar</label>
                            <select id="pillarFilter" class="form-select">
                                <option value="">All Pillars</option>
                                <option value="Educational Tutorials">Educational Tutorials</option>
                                <option value="Product Demos">Product Demos</option>
                                <option value="Customer Success Stories">Customer Success Stories</option>
                                <option value="Support Library">Support Library</option>
                                <option value="Marketing & Updates">Marketing & Updates</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Filter by Phase</label>
                            <select id="phaseFilter" class="form-select">
                                <option value="">All Phases</option>
                                <option value="Idea">Idea</option>
                                <option value="Script">Script</option>
                                <option value="Recording">Recording</option>
                                <option value="Editing">Editing</option>
                                <option value="Review">Review</option>
                                <option value="Published">Published</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Search Title</label>
                            <input type="text" id="titleSearch" class="form-control" placeholder="Search content titles...">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">&nbsp;</label>
                            <div class="d-flex gap-2">
                                <button id="applyFilters" class="btn btn-primary">
                                    <i class="bi bi-funnel mr-1"></i>Apply
                                </button>
                                <button id="clearFilters" class="btn btn-outline-secondary">
                                    <i class="bi bi-x-circle mr-1"></i>Clear
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Kanban Board Section -->
        <section>
            <div class="container-fluid px-4">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-xl font-semibold text-gray-900">
                        <i class="bi bi-kanban mr-2"></i>
                        Content Creation Workflow
                    </h2>
                    <div class="flex items-center space-x-2">
                        <span class="text-sm text-gray-600">Drag and drop to move content between phases</span>
                        <button id="toggleView" class="btn btn-outline-secondary btn-sm">
                            <i class="bi bi-list-ul mr-1"></i>
                            List View
                        </button>
                    </div>
                </div>
                <div id="kanbanBoard" class="kanban-board">
                    <!-- Kanban columns will be populated here -->
                </div>
            </div>
        </section>
    </div>

    <!-- Add/Edit Content Modal -->
    <div class="modal fade" id="contentModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="contentModalTitle">Add New Content</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="contentForm">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label for="contentTitle" class="form-label">Title *</label>
                                <input type="text" class="form-control" id="contentTitle" required>
                            </div>
                            <div class="col-md-6">
                                <label for="contentPillar" class="form-label">Pillar *</label>
                                <select class="form-select" id="contentPillar" required>
                                    <option value="">Select a pillar</option>
                                    <option value="Educational Tutorials">Educational Tutorials</option>
                                    <option value="Product Demos">Product Demos</option>
                                    <option value="Customer Success Stories">Customer Success Stories</option>
                                    <option value="Support Library">Support Library</option>
                                    <option value="Marketing & Updates">Marketing & Updates</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label for="contentPhase" class="form-label">Workflow Phase</label>
                                <select class="form-select" id="contentPhase">
                                    <option value="Idea">Idea</option>
                                    <option value="Script">Script</option>
                                    <option value="Recording">Recording</option>
                                    <option value="Editing">Editing</option>
                                    <option value="Review">Review</option>
                                    <option value="Published">Published</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label for="contentAssignee" class="form-label">Assigned To</label>
                                <input type="email" class="form-control" id="contentAssignee" placeholder="user@example.com">
                            </div>
                            <div class="col-md-6">
                                <label for="contentDueDate" class="form-label">Due Date</label>
                                <input type="date" class="form-control" id="contentDueDate">
                            </div>
                            <div class="col-md-6">
                                <label for="contentPublishedUrl" class="form-label">Published URL</label>
                                <input type="url" class="form-control" id="contentPublishedUrl" placeholder="https://youtube.com/watch?v=...">
                            </div>
                            <div class="col-12">
                                <label for="contentAssets" class="form-label">Assets</label>
                                <textarea class="form-control" id="contentAssets" rows="2" placeholder="Links to scripts, thumbnails, etc."></textarea>
                            </div>
                            <div class="col-12">
                                <label for="contentNotes" class="form-label">Notes</label>
                                <textarea class="form-control" id="contentNotes" rows="3" placeholder="Internal notes and comments"></textarea>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="saveContentBtn">Save Content</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Content Details Modal -->
    <div class="modal fade" id="detailsModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Content Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="detailsModalBody">
                    <!-- Content details will be populated here -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary" id="editContentBtn">Edit</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="toast" class="toast" role="alert">
            <div class="toast-header">
                <i class="bi bi-info-circle text-primary me-2"></i>
                <strong class="me-auto">Notification</strong>
                <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
            </div>
            <div class="toast-body" id="toastMessage">
                <!-- Toast message will be populated here -->
            </div>
        </div>
    </div>

    <script>
        // Global variables
        let contentData = [];
        let filteredData = [];
        let currentFilters = {};
        let isListView = false;

        // Initialize the application
        document.addEventListener('DOMContentLoaded', function() {
            initializeApp();
        });

        // Initialize application
        async function initializeApp() {
            try {
                showLoading(true);
                
                // Initialize sheets if needed
                await initSheets();
                
                // Load initial data
                await loadDashboardData();
                await loadKanbanData();
                
                // Set up event listeners
                setupEventListeners();
                
                showLoading(false);
                showToast('Application loaded successfully!', 'success');
                
            } catch (error) {
                console.error('Error initializing app:', error);
                showToast('Error loading application: ' + error.message, 'error');
                showLoading(false);
            }
        }

        // Show/hide loading screen
        function showLoading(show) {
            const loadingScreen = document.getElementById('loadingScreen');
            const mainContent = document.getElementById('mainContent');
            
            if (show) {
                loadingScreen.classList.remove('hidden');
                mainContent.style.display = 'none';
            } else {
                loadingScreen.classList.add('hidden');
                mainContent.style.display = 'block';
            }
        }

        // Load dashboard data
        async function loadDashboardData() {
            try {
                const metrics = await new Promise((resolve, reject) => {
                    google.script.run
                        .withSuccessHandler(resolve)
                        .withFailureHandler(reject)
                        .getDashboardMetrics();
                });

                renderDashboardCards(metrics);
            } catch (error) {
                console.error('Error loading dashboard data:', error);
                showToast('Error loading dashboard data', 'error');
            }
        }

        // Load Kanban data
        async function loadKanbanData() {
            try {
                const assets = await new Promise((resolve, reject) => {
                    google.script.run
                        .withSuccessHandler(resolve)
                        .withFailureHandler(reject)
                        .getContentAssets();
                });

                contentData = assets;
                filteredData = [...contentData];
                renderKanbanBoard();
            } catch (error) {
                console.error('Error loading Kanban data:', error);
                showToast('Error loading content data', 'error');
            }
        }

        // Render dashboard cards
        function renderDashboardCards(metrics) {
            const container = document.getElementById('dashboardCards');
            
            const cards = [
                {
                    title: 'Total Content',
                    value: metrics.totalContent || 0,
                    icon: 'bi-folder',
                    color: 'primary',
                    change: '+12%'
                },
                {
                    title: 'Published',
                    value: metrics.publishedCount || 0,
                    icon: 'bi-check-circle',
                    color: 'success',
                    change: '+8%'
                },
                {
                    title: 'In Progress',
                    value: metrics.inProgressCount || 0,
                    icon: 'bi-clock',
                    color: 'warning',
                    change: '+5%'
                },
                {
                    title: 'Overdue',
                    value: metrics.overdueCount || 0,
                    icon: 'bi-exclamation-triangle',
                    color: 'danger',
                    change: '-2%'
                },
                {
                    title: 'This Week',
                    value: metrics.thisWeek || 0,
                    icon: 'bi-calendar-week',
                    color: 'info',
                    change: '+15%'
                },
                {
                    title: 'Completion Rate',
                    value: (metrics.completionRate || 0) + '%',
                    icon: 'bi-graph-up',
                    color: 'primary',
                    change: '+3%'
                }
            ];

            container.innerHTML = cards.map(card => `
                <div class="col-md-4 col-lg-2">
                    <div class="metric-card fade-in">
                        <div class="d-flex align-items-center justify-content-between">
                            <div>
                                <div class="metric-value text-${card.color}">${card.value}</div>
                                <div class="metric-label">${card.title}</div>
                                <div class="metric-change ${card.change.startsWith('+') ? 'positive' : 'negative'}">
                                    ${card.change} from last week
                                </div>
                            </div>
                            <div class="text-${card.color}">
                                <i class="bi ${card.icon} fs-1"></i>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Render Kanban board
        function renderKanbanBoard() {
            const container = document.getElementById('kanbanBoard');
            const phases = ['Idea', 'Script', 'Recording', 'Editing', 'Review', 'Published'];
            
            container.innerHTML = phases.map(phase => {
                const phaseContent = filteredData.filter(item => item.workflowPhase === phase);
                const phaseColors = {
                    'Idea': 'secondary',
                    'Script': 'primary',
                    'Recording': 'info',
                    'Editing': 'warning',
                    'Review': 'danger',
                    'Published': 'success'
                };
                
                return `
                    <div class="phase-column" data-phase="${phase}">
                        <div class="phase-header">
                            <div class="phase-title">${phase}</div>
                            <div class="phase-count bg-${phaseColors[phase]}">${phaseContent.length}</div>
                        </div>
                        <div class="phase-content" id="phase-${phase}">
                            ${phaseContent.map(item => createTaskCard(item)).join('')}
                        </div>
                    </div>
                `;
            }).join('');

            // Initialize sortable for drag and drop
            initializeSortable();
        }

        // Create task card
        function createTaskCard(item) {
            const pillarClass = getPillarClass(item.pillar);
            const dueDate = item.dueDate ? new Date(item.dueDate) : null;
            const isOverdue = dueDate && dueDate < new Date();
            const isDueSoon = dueDate && dueDate <= new Date(Date.now() + 3 * 24 * 60 * 60 * 1000);
            
            return `
                <div class="task-card ${isOverdue ? 'overdue' : isDueSoon ? 'due-soon' : ''}" 
                     data-id="${item.id}" 
                     data-phase="${item.workflowPhase}">
                    <div class="task-title">${item.title || 'Untitled'}</div>
                    <div class="task-pillar ${pillarClass}">${item.pillar || 'No Pillar'}</div>
                    <div class="task-meta">
                        <div class="task-assignee">
                            <i class="bi bi-person"></i>
                            <span>${item.assignedTo || 'Unassigned'}</span>
                        </div>
                        ${dueDate ? `
                            <div class="task-due-date ${isOverdue ? 'overdue' : isDueSoon ? 'due-soon' : ''}">
                                <i class="bi bi-calendar"></i>
                                ${dueDate.toLocaleDateString()}
                            </div>
                        ` : ''}
                    </div>
                </div>
            `;
        }

        // Get pillar CSS class
        function getPillarClass(pillar) {
            const classes = {
                'Educational Tutorials': 'pillar-educational',
                'Product Demos': 'pillar-product',
                'Customer Success Stories': 'pillar-success',
                'Support Library': 'pillar-support',
                'Marketing & Updates': 'pillar-marketing'
            };
            return classes[pillar] || 'pillar-educational';
        }

        // Initialize sortable for drag and drop
        function initializeSortable() {
            const phaseColumns = document.querySelectorAll('.phase-content');
            
            phaseColumns.forEach(column => {
                new Sortable(column, {
                    group: 'kanban',
                    animation: 150,
                    ghostClass: 'sortable-ghost',
                    chosenClass: 'sortable-chosen',
                    dragClass: 'sortable-drag',
                    onEnd: function(evt) {
                        const itemId = evt.item.dataset.id;
                        const newPhase = evt.to.parentElement.dataset.phase;
                        const oldPhase = evt.from.parentElement.dataset.phase;
                        
                        if (newPhase !== oldPhase) {
                            updateContentPhase(itemId, newPhase);
                        }
                    }
                });
            });
        }

        // Update content phase
        async function updateContentPhase(contentId, newPhase) {
            try {
                const result = await new Promise((resolve, reject) => {
                    google.script.run
                        .withSuccessHandler(resolve)
                        .withFailureHandler(reject)
                        .updateContentAsset(contentId, { WorkflowPhase: newPhase });
                });

                if (result.success) {
                    // Update local data
                    const item = contentData.find(item => item.id === contentId);
                    if (item) {
                        item.workflowPhase = newPhase;
                        item.updatedAt = new Date().toISOString();
                    }
                    
                    // Refresh display
                    await loadDashboardData();
                    showToast(`Content moved to ${newPhase}`, 'success');
                } else {
                    throw new Error(result.error?.message || 'Failed to update content phase');
                }
            } catch (error) {
                console.error('Error updating content phase:', error);
                showToast('Error updating content phase: ' + error.message, 'error');
                // Reload data to revert changes
                await loadKanbanData();
            }
        }

        // Set up event listeners
        function setupEventListeners() {
            // Refresh button
            document.getElementById('refreshBtn').addEventListener('click', async () => {
                await loadDashboardData();
                await loadKanbanData();
                showToast('Data refreshed', 'success');
            });

            // Add content button
            document.getElementById('addContentBtn').addEventListener('click', () => {
                showContentModal();
            });

            // Save content button
            document.getElementById('saveContentBtn').addEventListener('click', saveContent);

            // Filter buttons
            document.getElementById('applyFilters').addEventListener('click', applyFilters);
            document.getElementById('clearFilters').addEventListener('click', clearFilters);

            // Toggle view button
            document.getElementById('toggleView').addEventListener('click', toggleView);

            // Task card clicks
            document.addEventListener('click', (e) => {
                const taskCard = e.target.closest('.task-card');
                if (taskCard) {
                    const contentId = taskCard.dataset.id;
                    showContentDetails(contentId);
                }
            });
        }

        // Show content modal
        function showContentModal(contentId = null) {
            const modal = new bootstrap.Modal(document.getElementById('contentModal'));
            const form = document.getElementById('contentForm');
            const title = document.getElementById('contentModalTitle');
            
            if (contentId) {
                // Edit mode
                const item = contentData.find(item => item.id === contentId);
                if (item) {
                    title.textContent = 'Edit Content';
                    populateForm(item);
                }
            } else {
                // Add mode
                title.textContent = 'Add New Content';
                form.reset();
            }
            
            modal.show();
        }

        // Populate form with content data
        function populateForm(item) {
            document.getElementById('contentTitle').value = item.title || '';
            document.getElementById('contentPillar').value = item.pillar || '';
            document.getElementById('contentPhase').value = item.workflowPhase || 'Idea';
            document.getElementById('contentAssignee').value = item.assignedTo || '';
            document.getElementById('contentDueDate').value = item.dueDate ? new Date(item.dueDate).toISOString().split('T')[0] : '';
            document.getElementById('contentPublishedUrl').value = item.publishedUrl || '';
            document.getElementById('contentAssets').value = item.assets || '';
            document.getElementById('contentNotes').value = item.notes || '';
        }

        // Save content
        async function saveContent() {
            try {
                const form = document.getElementById('contentForm');
                if (!form.checkValidity()) {
                    form.reportValidity();
                    return;
                }

                const contentData = {
                    title: document.getElementById('contentTitle').value,
                    pillar: document.getElementById('contentPillar').value,
                    workflowPhase: document.getElementById('contentPhase').value,
                    assignedTo: document.getElementById('contentAssignee').value,
                    dueDate: document.getElementById('contentDueDate').value,
                    publishedUrl: document.getElementById('contentPublishedUrl').value,
                    assets: document.getElementById('contentAssets').value,
                    notes: document.getElementById('contentNotes').value
                };

                const result = await new Promise((resolve, reject) => {
                    google.script.run
                        .withSuccessHandler(resolve)
                        .withFailureHandler(reject)
                        .createContentAsset(contentData);
                });

                if (result.success) {
                    showToast('Content saved successfully!', 'success');
                    bootstrap.Modal.getInstance(document.getElementById('contentModal')).hide();
                    await loadKanbanData();
                    await loadDashboardData();
                } else {
                    throw new Error(result.error?.message || 'Failed to save content');
                }
            } catch (error) {
                console.error('Error saving content:', error);
                showToast('Error saving content: ' + error.message, 'error');
            }
        }

        // Show content details
        async function showContentDetails(contentId) {
            try {
                const item = contentData.find(item => item.id === contentId);
                if (!item) {
                    showToast('Content not found', 'error');
                    return;
                }

                const modalBody = document.getElementById('detailsModalBody');
                modalBody.innerHTML = `
                    <div class="row g-3">
                        <div class="col-md-6">
                            <strong>Title:</strong><br>
                            ${item.title || 'Untitled'}
                        </div>
                        <div class="col-md-6">
                            <strong>Pillar:</strong><br>
                            <span class="task-pillar ${getPillarClass(item.pillar)}">${item.pillar || 'No Pillar'}</span>
                        </div>
                        <div class="col-md-6">
                            <strong>Phase:</strong><br>
                            <span class="badge bg-primary">${item.workflowPhase || 'Idea'}</span>
                        </div>
                        <div class="col-md-6">
                            <strong>Assigned To:</strong><br>
                            ${item.assignedTo || 'Unassigned'}
                        </div>
                        <div class="col-md-6">
                            <strong>Due Date:</strong><br>
                            ${item.dueDate ? new Date(item.dueDate).toLocaleDateString() : 'Not set'}
                        </div>
                        <div class="col-md-6">
                            <strong>Published URL:</strong><br>
                            ${item.publishedUrl ? `<a href="${item.publishedUrl}" target="_blank">${item.publishedUrl}</a>` : 'Not published'}
                        </div>
                        <div class="col-12">
                            <strong>Assets:</strong><br>
                            ${item.assets || 'None'}
                        </div>
                        <div class="col-12">
                            <strong>Notes:</strong><br>
                            ${item.notes || 'None'}
                        </div>
                        <div class="col-md-6">
                            <strong>Created:</strong><br>
                            ${item.createdAt ? new Date(item.createdAt).toLocaleString() : 'Unknown'}
                        </div>
                        <div class="col-md-6">
                            <strong>Updated:</strong><br>
                            ${item.updatedAt ? new Date(item.updatedAt).toLocaleString() : 'Unknown'}
                        </div>
                    </div>
                `;

                // Set up edit button
                document.getElementById('editContentBtn').onclick = () => {
                    bootstrap.Modal.getInstance(document.getElementById('detailsModal')).hide();
                    showContentModal(contentId);
                };

                const modal = new bootstrap.Modal(document.getElementById('detailsModal'));
                modal.show();
            } catch (error) {
                console.error('Error showing content details:', error);
                showToast('Error loading content details', 'error');
            }
        }

        // Apply filters
        function applyFilters() {
            const pillar = document.getElementById('pillarFilter').value;
            const phase = document.getElementById('phaseFilter').value;
            const title = document.getElementById('titleSearch').value.toLowerCase();

            currentFilters = { pillar, phase, title };

            filteredData = contentData.filter(item => {
                const matchesPillar = !pillar || item.pillar === pillar;
                const matchesPhase = !phase || item.workflowPhase === phase;
                const matchesTitle = !title || (item.title && item.title.toLowerCase().includes(title));
                
                return matchesPillar && matchesPhase && matchesTitle;
            });

            renderKanbanBoard();
            showToast(`Filtered to ${filteredData.length} items`, 'info');
        }

        // Clear filters
        function clearFilters() {
            document.getElementById('pillarFilter').value = '';
            document.getElementById('phaseFilter').value = '';
            document.getElementById('titleSearch').value = '';
            
            currentFilters = {};
            filteredData = [...contentData];
            renderKanbanBoard();
            showToast('Filters cleared', 'info');
        }

        // Toggle view
        function toggleView() {
            isListView = !isListView;
            const button = document.getElementById('toggleView');
            
            if (isListView) {
                button.innerHTML = '<i class="bi bi-kanban mr-1"></i>Kanban View';
                // TODO: Implement list view
                showToast('List view not yet implemented', 'info');
            } else {
                button.innerHTML = '<i class="bi bi-list-ul mr-1"></i>List View';
                renderKanbanBoard();
            }
        }

        // Initialize sheets
        async function initSheets() {
            try {
                const result = await new Promise((resolve, reject) => {
                    google.script.run
                        .withSuccessHandler(resolve)
                        .withFailureHandler(reject)
                        .initYtSheets();
                });

                if (result.success) {
                    showToast('Sheets initialized successfully!', 'success');
                    await loadDashboardData();
                    await loadKanbanData();
                } else {
                    throw new Error(result.error?.message || 'Failed to initialize sheets');
                }
            } catch (error) {
                console.error('Error initializing sheets:', error);
                showToast('Error initializing sheets: ' + error.message, 'error');
            }
        }

        // Export data
        async function exportData() {
            try {
                const csvData = await new Promise((resolve, reject) => {
                    google.script.run
                        .withSuccessHandler(resolve)
                        .withFailureHandler(reject)
                        .exportContentAssetsToCSV();
                });

                const blob = new Blob([csvData], { type: 'text/csv' });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `youtube-content-${new Date().toISOString().split('T')[0]}.csv`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                window.URL.revokeObjectURL(url);
                
                showToast('Data exported successfully!', 'success');
            } catch (error) {
                console.error('Error exporting data:', error);
                showToast('Error exporting data: ' + error.message, 'error');
            }
        }

        // Clear cache
        async function clearCache() {
            try {
                const result = await new Promise((resolve, reject) => {
                    google.script.run
                        .withSuccessHandler(resolve)
                        .withFailureHandler(reject)
                        .clearAllCaches();
                });

                if (result.success) {
                    showToast('Cache cleared successfully!', 'success');
                    await loadDashboardData();
                    await loadKanbanData();
                } else {
                    throw new Error(result.error?.message || 'Failed to clear cache');
                }
            } catch (error) {
                console.error('Error clearing cache:', error);
                showToast('Error clearing cache: ' + error.message, 'error');
            }
        }

        // Show toast notification
        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            const toastHeader = toast.querySelector('.toast-header');
            
            toastMessage.textContent = message;
            
            // Update icon and color based on type
            const icon = toastHeader.querySelector('i');
            icon.className = `bi me-2 text-${type === 'success' ? 'success' : type === 'error' ? 'danger' : 'primary'} ${
                type === 'success' ? 'bi-check-circle' : 
                type === 'error' ? 'bi-exclamation-triangle' : 
                'bi-info-circle'
            }`;
            
            const bsToast = new bootstrap.Toast(toast);
            bsToast.show();
        }
    </script>
</body>
</html>
